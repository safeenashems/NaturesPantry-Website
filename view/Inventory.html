<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory</title>
 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="../assets/style/superMarket.css"> 
    <!-- Add Font Awesome CDN for edit and delete buttons-->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!-- <script src="https://kit.fontawesome.com/c4254e24a8.js" crossorigin="anonymous"></script> -->
    
    <style>table tbody tr:hover{ background-color: #e0ded8 !important;} </style>
</head>
<body>
  <!-- logout Button  -->
 <button id="logoutBtn" onclick ="logout()" style="float:right;padding:5px;margin: 1vw;background-color: rgb(240, 47, 47);border-radius: 10%;">
  Logout
 </button>
   

    <!-- Button to trigger the Add Product modal -->
    <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#addProductModal" style="margin:1% auto 1% 10%;">
      Add 
    </button>


    <!-- Product Table -->
    <table id="productTable"  class="table table-bordered"  style="width: 80%; margin: 5px auto 2% auto;">
     <!-- <caption style="caption-side: top;text-align: center;color: red;padding: 0%;"><p><b>INVENTORY LIST</b></p></caption> -->
     <thead> 
     
      <tr>
     
        <th>Product ID</th>
        <th>Product Name</th>
        <th>Unit Price</th>
        <th>Product Category</th>
        <th>Quantity</th>
        <th>Product Description</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
     
      <!-- rows will be added here dynamically -->
    </tbody>
  </table>

     <!-- Button to trigger the sell Product modal -->
     <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#sellProductModal" style="margin:1% auto 0% 10%;">
      Sell
    </button>
    <!-- <H5 style="display: flex;align-items: center;color: red;margin: auto;">SALES</H5> -->

      <!-- sales Table -->
      <table id="salesTable" border=2px class="table table-bordered"  style="width: 80%; margin: 5px auto 2% auto;">
        <!-- <caption style="caption-side: top;text-align: center;color: red;padding: 0;"><H5>SALES</H5></caption>  -->
        <thead > 
         <tr>
           <th>Product ID</th>
           <th>Product Name</th>
           <th>Unit Price</th>
           <th>Product Category</th>
           <th>Quantity</th>
           <th>Product Description</th>
           <th>Actions</th>
          
         </tr>
       </thead>
       <tbody>
         <!-- rows will be added here dynamically -->
       </tbody>
     </table>

  <!-- Bootstrap Add Product Modalform -->
  <div class="modal fade" id="addProductModal" tabindex="-1" aria-labelledby="addProductModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addProductModalLabel">Add Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Add Product Form -->
          <form id="addPdtForm" onsubmit="addPdt(event)">
            <div class="mb-3">
              <input type="number" class="form-control" placeholder="Product ID" id="pdtID" required>
            </div>
            <div class="mb-3">
              <input type="text" class="form-control" placeholder="Product Name" id="pdtName" required>
            </div>
            <div class="mb-3">
              <input type="number" class="form-control" placeholder="Unit Price" id="unitPrice" required>
            </div>
            <div class="mb-3">
              <select class="form-select" id="pdtCtgr" required>
                <option value="Fruits">Fruits</option>
                <option value="Veggies">Veggies</option>
                <option value="Snacks">Snacks</option>
                <option value="Groceries">Groceries</option>
                <option value="Spices & Herbs">Spices & Herbs</option>
              </select>
            </div>
            <div class="mb-3">
              <input type="number" class="form-control" placeholder="Quantity" id="qty" required>
            </div>
            <div class="mb-3">
              <input type="text" class="form-control" placeholder="Description" id="desc" required>
            </div>
            <button type="submit" class="btn btn-success">ADD</button>
          </form>
        </div>
      </div>
    </div>
  </div>



 <!-- Sell Product Modal -->
 <div class="modal fade" id="sellProductModal" tabindex="-1" aria-labelledby="sellProductModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="sellProductModalLabel">Sell Product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <!-- Sell Product Form -->
        <form id="sellPdtForm" onsubmit="sellProduct(event)">
          <div class="mb-3">
            <input type="number" class="form-control" placeholder="Product ID" id="sellPdtID" required>
          </div>
          <div class="mb-3">
            <input type="number" class="form-control" placeholder="Quantity to Sell" id="sellQty" required>
          </div>
          <button type="submit" class="btn btn-primary">Sell</button>
        </form>
      </div>
    </div>
  </div>
</div>



<!-- Toast container (can be placed anywhere, usually at the top or bottom of the page) -->
<div aria-live="polite" aria-atomic="true" style="position: relative; min-height: 100px;">
  <!-- Success Toast -->
  <div id="successToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" style="position: absolute; top: 10px; right: 10px; display: none;">
    <div class="d-flex">
      <div class="toast-body">
        Success message here
      </div>
      <div class="m-3">
        <i class="fas fa-check-circle"></i>
      </div>
    </div>
  </div>

  <!-- Warning Toast -->
  <div id="warningToast" class="toast align-items-center text-white bg-warning border-0" role="alert" aria-live="assertive" aria-atomic="true" style="position: absolute; top: 10px; right: 10px; display: none;">
    <div class="d-flex">
     
      <div class="m-3">
        <i class="fas fa-exclamation-triangle"></i>
      </div>
      <div class="toast-body">
        Warning message here
      </div>
    </div>
  </div>

  <!-- Danger Toast -->
  <div id="dangerToast" class="toast align-items-center text-white bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true" style="position: absolute; top: 10px; right: 10px; display: none;">
    <div class="d-flex">
      <div class="toast-body">
        Danger message here
      </div>
      <div class="m-3">
        <i class="fas fa-times-circle"></i>
      </div>
    </div>
  </div>
</div>

<!-- Include Font Awesome for the toast  icons -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>

<!-- JS to handle product operations -->

<script src="../script/inventory.js"></script>

</body>
</html>
